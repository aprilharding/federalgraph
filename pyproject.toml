[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federalgraph"
version = "0.1.0"
description = "Compile authoritative federal data into a canonical government knowledge graph."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "April Harding"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
federalgraph = "federalgraph.cli:main"

[tool.setuptools.packages.find]
include = ["federalgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
